<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maira AI 3.5 Pro</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box;font-family:'Plus Jakarta Sans',sans-serif}
body{background:#eef2ff;min-height:100vh;display:flex;justify-content:center;padding:15px}
.card{width:100%;max-width:1050px;background:#fff;border-radius:24px;box-shadow:0 20px 60px rgba(0,0,0,.08);overflow:hidden}
.topbar{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;font-size:13px;font-weight:600;border-bottom:1px solid #f0f0f5}
.hero{text-align:center;padding:50px 20px}
.hero h1{font-size:32px;line-height:1.1}
.hero h1 span{color:#8a93b5;font-weight:500}
.search{max-width:680px;margin:35px auto 0;border:1px solid #e6e8f5;border-radius:20px;padding:16px;background:#fff;box-shadow:0 10px 30px rgba(0,0,0,.04)}
.search input{width:100%;border:0;outline:0;font-size:15px}
.row{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.row button{border:1px solid #eee;padding:7px 12px;border-radius:20px;background:#f7f8ff;font-size:12px}
.send{background:#111!important;color:#fff!important;border-radius:50%!important;width:36px;height:36px}
</style>
</head>
<body>
<div class="card">
<div class="topbar"><span>● Maira AI 3.5 Pro</span><span>Upgrade ✨</span></div>
<div class="hero">
<h1><span>Hi, I'm Maira</span><br>Ready to Achieve Great Things?</h1>
<p style="margin-top:15px">🤖</p>
<div class="search">
<input id="q" placeholder="Initiate a query or send a command to the AI...">
<div class="row">
<button>📎 Attach</button><button>🧠 Reasoning</button><button>🔍 Deep Research</button><button class="send" onclick="let v=document.getElementById('q').value;if(v)alert('Maira AI: '+v)">↗</button>
</div>
</div>
</div>
</div>
</body>
</html>
