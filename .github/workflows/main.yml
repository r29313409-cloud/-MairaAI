name: Build Maira AI APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip
          unzip -q gradle-8.5-bin.zip -d /tmp
          echo "/tmp/gradle-8.5/bin" >> $GITHUB_PATH
      - name: Build APK
        run: |
          rm -rf app build.gradle settings.gradle gradle gradlew
          mkdir -p app/src/main/java/com/maira/ai
          echo "include ':app'" > settings.gradle
          echo "buildscript { repositories { google(); mavenCentral() } dependencies { classpath 'com.android.tools.build:gradle:8.2.0' } } allprojects { repositories { google(); mavenCentral() } }" > build.gradle
          cat > app/build.gradle << 'EOF'
          apply plugin: 'com.android.application'
          android { compileSdkVersion 34; namespace 'com.maira.ai'; defaultConfig { applicationId "com.maira.ai"; minSdkVersion 21; targetSdkVersion 34; versionCode 1; versionName "1.0" }; compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 } }
          EOF
          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"><uses-permission android:name="android.permission.INTERNET" /><application android:label="Maira AI"><activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>
          EOF
          cat > app/src/main/java/com/maira/ai/MainActivity.java << 'EOF'
          package com.maira.ai; import android.app.Activity; import android.os.Bundle; import android.webkit.WebView; import android.webkit.WebViewClient; public class MainActivity extends Activity { protected void onCreate(Bundle b){ super.onCreate(b); WebView w=new WebView(this); w.getSettings().setJavaScriptEnabled(true); w.setWebViewClient(new WebViewClient()); w.loadUrl("https://r29313409-cloud.github.io/-MairaAI/"); setContentView(w); } }
          EOF
          gradle wrapper --gradle-version 8.5
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Maira-AI-APK
          path: app/build/outputs/apk/debug/app-debug.apkname: Deploy Maira AI

on:
  push:
    branches: [ "main" ]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - uses: actions/deploy-pages@v4
