name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build APK
        run: |
          rm -rf app build.gradle settings.gradle
          mkdir -p app/src/main/java/com/maira/ai
          echo "include ':app'" > settings.gradle
          cat > build.gradle <<'ENDOFF'
          buildscript {
            repositories { google(); mavenCentral() }
            dependencies { classpath 'com.android.tools.build:gradle:8.1.4' }
          }
          allprojects { repositories { google(); mavenCentral() } }
          ENDOFF
          cat > app/build.gradle <<'ENDOFF'
          plugins { id 'com.android.application' }
          android {
            namespace 'com.maira.ai'
            compileSdk 33
            defaultConfig {
              applicationId "com.maira.ai"
              minSdk 21
              targetSdk 33
              versionCode 1
              versionName "1.0"
            }
          }
          ENDOFF
          cat > app/src/main/AndroidManifest.xml <<'ENDOFF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"><uses-permission android:name="android.permission.INTERNET"/><application android:label="Maira AI"><activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>
          ENDOFF
          cat > app/src/main/java/com/maira/ai/MainActivity.java <<'ENDOFF'
          package com.maira.ai;
          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          public class MainActivity extends Activity {
            protected void onCreate(Bundle b){
              super.onCreate(b);
              WebView w=new WebView(this);
              w.getSettings().setJavaScriptEnabled(true);
              w.setWebViewClient(new WebViewClient());
              w.loadUrl("https://r29313409-cloud.github.io/-MairaAI/");
              setContentView(w);
            }
          }
          ENDOFF
          wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip
          unzip -q gradle-8.5-bin.zip
          ./gradle-8.5/bin/gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Maira-AI-APK
          path: app/build/outputs/apk/debug/*.apk
