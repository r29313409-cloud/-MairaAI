name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: Build
        run: |
          yes | sdkmanager --licenses
          rm -rf app build.gradle settings.gradle
          mkdir -p app/src/main/java/com/maira/ai
          echo "include ':app'" > settings.gradle
          echo "buildscript { repositories { google(); mavenCentral() } dependencies { classpath 'com.android.tools.build:gradle:8.1.4' } } allprojects { repositories { google(); mavenCentral() } }" > build.gradle
          printf "plugins { id 'com.android.application' }\nandroid { namespace 'com.maira.ai'; compileSdk 33; defaultConfig { applicationId 'com.maira.ai'; minSdk 21; targetSdk 33; versionCode 1; versionName '1.0' } }\n" > app/build.gradle
          echo '<manifest xmlns:android="http://schemas.android.com/apk/res/android"><uses-permission android:name="android.permission.INTERNET"/><application android:label="Maira AI"><activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>' > app/src/main/AndroidManifest.xml
          echo 'package com.maira.ai; import android.app.Activity; import android.os.Bundle; import android.webkit.WebView; import android.webkit.WebViewClient; public class MainActivity extends Activity { protected void onCreate(Bundle b){ super.onCreate(b); WebView w=new WebView(this); w.getSettings().setJavaScriptEnabled(true); w.setWebViewClient(new WebViewClient()); w.loadUrl("https://r29313409-cloud.github.io/-MairaAI/"); setContentView(w); } }' > app/src/main/java/com/maira/ai/MainActivity.java
          wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip
          unzip -q gradle-8.5-bin.zip
          ./gradle-8.5/bin/gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Maira-AI-APK
          path: app/build/outputs/apk/debug/*.apk
